name: Teinte
options:
  bundleIdPrefix: app.teinte
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  TeinteCore:
    path: Packages/TeinteCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    COREML_CODEGEN_LANGUAGE: None
targets:
  Teinte:
    type: application
    platform: macOS
    sources:
      - path: Teinte
    dependencies:
      - package: TeinteCore
    entitlements:
      path: Teinte/Teinte.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: Teinte/Info.plist
      properties:
        CFBundleDisplayName: Teinte
        CFBundleName: Teinte
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Teinte"
        ATSApplicationFontsPath: "."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teinte.Teinte
        PRODUCT_NAME: Teinte
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  TeinteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TeinteTests
      - path: Packages/TeinteCore/Tests/TeinteCoreTests/Fixtures/siglip_text_embeddings.json
        buildPhase: resources
    dependencies:
      - target: Teinte
      - package: TeinteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.teinte.TeinteTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Teinte.app/Contents/MacOS/Teinte"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Teinte:
    build:
      targets:
        Teinte: all
        TeinteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TeinteTests
